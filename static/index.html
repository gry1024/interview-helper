<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="围绕真实项目持续深挖的 LLM 实习模拟面试">
    <title>Interview Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="preconnect" href="https://registry.npmmirror.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="/styles.css?v=15">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="/app.js?v=15" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">IH</span>
          <div>
            <p class="brand-name">Interview Helper</p>
            <p class="brand-caption">项目深挖模拟面试</p>
          </div>
        </div>

        <nav class="tabs" role="tablist" aria-orientation="vertical">
          <button
            class="tab-btn active"
            id="tab-interview"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="panel-interview"
            data-panel="interview"
          >
            模拟面试
          </button>
          <button
            class="tab-btn"
            id="tab-reviews"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="panel-reviews"
            data-panel="reviews"
            tabindex="-1"
          >
            面试复盘
          </button>
          <button
            class="tab-btn"
            id="tab-jds"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="panel-jds"
            data-panel="jds"
            tabindex="-1"
          >
            JD/面经库
          </button>
        </nav>

        <p class="sidebar-note">只问你的项目，以及它对岗位是否真正有价值。</p>
      </aside>

      <main class="main-content">
        <section
          class="panel"
          id="panel-interview"
          role="tabpanel"
          aria-labelledby="tab-interview"
          tabindex="0"
        >
          <p class="eyebrow">模拟面试</p>
          <h1>把简历上的项目，<br>变成你真正拥有的项目。</h1>
          <p class="lead">只问你的一个项目，以及它对岗位是否真正有价值。</p>

          <div class="interview-start" id="interview-start">
            <form class="session-form" id="session-form" novalidate>
              <label class="field">
                <span>GitHub 仓库</span>
                <input
                  class="input"
                  id="github-url"
                  name="github_url"
                  type="url"
                  inputmode="url"
                  autocomplete="url"
                  maxlength="512"
                  placeholder="https://github.com/owner/repository"
                  aria-describedby="github-hint"
                  required
                >
                <p class="field-hint" id="github-hint">
                  这是你项目对应的代码 GitHub 仓库。面试官最终会按需核对陈述是否与代码相符。
                </p>
              </label>

              <label class="field">
                <span>项目陈述</span>
                <textarea
                  class="input"
                  id="statement"
                  name="statement"
                  rows="7"
                  maxlength="8000"
                  placeholder="粘贴简历中对这个项目的原始描述"
                  required
                ></textarea>
              </label>

              <label class="field">
                <span>目标岗位</span>
                <select class="input" id="role" name="role" required>
                  <option value="llm-algo">LLM 算法实习</option>
                  <option value="training">大模型训练与对齐</option>
                  <option value="rag">RAG 与 Agent 应用</option>
                </select>
              </label>

              <button class="btn btn-primary" id="start-session" type="submit">
                开始面试
              </button>
              <div id="session-status" aria-live="polite"></div>
            </form>
          </div>

          <div class="interview-live" id="interview-live" tabindex="-1" hidden>
            <section class="directions-block" aria-labelledby="directions-title">
              <p class="section-label">本场固定方向</p>
              <h2 id="directions-title">接下来会沿这些链路逐步深挖</h2>
              <ol class="direction-list" id="direction-list"></ol>
            </section>
            <p class="clone-notice" id="clone-notice" hidden></p>

            <div class="live-workspace" id="live-workspace">
              <div class="chat-shell">
                <div class="chat-log" id="chat-log" aria-live="polite"></div>
                <form class="chat-composer" id="chat-form">
                  <label class="sr-only" for="answer-input">你的回答</label>
                  <textarea
                    class="input"
                    id="answer-input"
                    name="answer"
                    rows="3"
                    maxlength="8000"
                    placeholder="回答当前问题"
                    required
                  ></textarea>
                  <div class="composer-actions">
                    <button class="btn btn-primary" id="send-answer" type="submit">
                      发送
                    </button>
                    <button class="btn" id="ask-teacher" type="button">
                      求助老师
                    </button>
                    <button class="btn" id="end-interview" type="button" disabled>
                      结束面试
                    </button>
                  </div>
                  <div id="turn-status" aria-live="polite"></div>
                </form>
              </div>

              <aside class="code-ide" id="code-ide" hidden aria-label="手撕代码编辑器">
                <div class="code-ide-collapsed-bar" id="code-ide-collapsed-bar">
                  <p class="code-ide-collapsed-text" id="code-ide-collapsed-text">已提交手撕代码</p>
                  <button class="btn" id="code-ide-expand" type="button">查看已提交代码</button>
                </div>
                <div class="code-ide-main" id="code-ide-main">
                  <header class="code-ide-header">
                    <div class="code-ide-heading-row">
                      <div class="code-ide-heading">
                        <p class="code-ide-kicker" id="code-ide-kicker">手撕代码 · Python</p>
                        <h3 class="code-ide-title" id="code-ide-title"></h3>
                      </div>
                      <button class="btn" id="code-ide-collapse" type="button" hidden>
                        收起
                      </button>
                    </div>
                    <p class="code-ide-prompt" id="code-ide-prompt"></p>
                  </header>
                  <div
                    class="code-ide-editor"
                    id="monaco-editor"
                    role="application"
                    aria-label="Python 代码编辑器"
                  ></div>
                  <footer class="code-ide-footer">
                    <p class="code-ide-meta" id="code-ide-meta">Python · 4 空格 · UTF-8</p>
                    <div class="code-ide-actions">
                      <div class="code-ide-status" id="code-ide-status" aria-live="polite"></div>
                      <button class="btn btn-primary" id="submit-code" type="button">
                        提交代码
                      </button>
                    </div>
                  </footer>
                </div>
              </aside>
            </div>
          </div>
        </section>

        <section
          class="panel"
          id="panel-reviews"
          role="tabpanel"
          aria-labelledby="tab-reviews"
          tabindex="0"
          hidden
        >
          <p class="eyebrow">面试复盘</p>
          <h1>每一次回答，都原样留下。</h1>
          <p class="lead">结束后将在这里查看完整对话、逐轮思考与综合报告。</p>
          <div id="reviews-root"></div>
        </section>

        <section
          class="panel"
          id="panel-jds"
          role="tabpanel"
          aria-labelledby="tab-jds"
          tabindex="0"
          hidden
        >
          <p class="eyebrow">JD/面经库</p>
          <h1>岗位本质，来自真实招聘与真实面试。</h1>
          <div
            class="library-kind-switch"
            role="tablist"
            aria-label="选择 JD 或面经"
          >
            <button
              class="kind-btn active"
              id="kind-jd"
              type="button"
              role="tab"
              aria-selected="true"
              data-kind="jd"
            >
              JD
            </button>
            <button
              class="kind-btn"
              id="kind-interview"
              type="button"
              role="tab"
              aria-selected="false"
              data-kind="interview"
            >
              面经
            </button>
          </div>
          <div class="sample-library" id="sample-library" aria-live="polite">
            <div class="loading-state" role="status">
              <span class="spinner" aria-hidden="true"></span>
              <span>正在加载真实样本</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
